name: Project checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  node-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and layout
        run: node scripts/check.mjs
      - name: Retained license notices
        run: node scripts/generate-notices.mjs --check
      - name: Configured game library
        run: node scripts/catalog.mjs
      - name: Unit, protocol, core and security tests
        run: node scripts/test.mjs
